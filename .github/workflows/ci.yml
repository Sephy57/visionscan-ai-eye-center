name: CI

# Engineering validation gate (NOT clinical validation).
# Runs on every push and PR. Must never require patient data, model
# artifacts, or external services:
#  - s9/s10 real-inference tests SKIP when the SegFormer artifact is absent
#    (documented SKIP-on-fresh-checkout behavior in those files)
#  - the SQLite database and data/ directories are created on demand

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize SQLite schema
        run: npm run db:init

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and integration tests
        # One worker keeps native image/OCR fixtures deterministic; each test
        # process is rooted in an isolated SQLite database.
        run: npm test -- --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Legacy migration dry run
        run: npm run migrate:data -- --dry-run --source tests/fixtures/legacy-store.json --destination "$RUNNER_TEMP/visionscan-test.db"

      - name: Backup plan (read-only)
        run: npm run backup:data -- --dry-run

      - name: Synthetic persistence benchmark
        run: npm run benchmark:persistence -- --records=1000,10000

      - name: Synthetic validation case contract
        run: npm run validation:cases

      - name: Phase 4 local intelligence safety acceptance
        # Deterministic, model-free coverage for anatomy integrity, OCT
        # aggregation, cross-model contradiction handling, OOD admission,
        # and worker failure semantics. Research weights stay out of hosted CI.
        run: npm exec vitest run tests/phase4-nextgen-local-intelligence.test.ts --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Phase 5 false-negative reduction acceptance
        # Synthetic, de-identified, model-free acceptance plus competition,
        # resource, deadline, process, lease, and security contracts.
        run: npm run validation:phase5

      - name: Phase 6 candidate and runtime acceptance
        # Candidate artifacts stay out of hosted inference; this validates the
        # immutable candidate bundle, fail-closed gates, and SQLite lease race.
        run: npm run validation:phase6

      - name: Phase 7 retinal intelligence and runtime acceptance
        # Phase 7 artifacts are aggregate research evidence; real local model
        # runs remain outside hosted CI and are never inferred here.
        run: npm run validation:phase7

      - name: Audit local model manifests
        run: npm run model:audit

      - name: Generate de-identified SBOM
        run: node scripts/generate-sbom.mjs --output "$RUNNER_TEMP/visionscan-sbom.cdx.json"

      - name: Generate release inventory
        run: node scripts/release-inventory.mjs --output "$RUNNER_TEMP/visionscan-release-inventory.json"

      - name: Filesystem audit
        run: npm run audit:fs

      - name: Production build
        run: npm run build

  # Keep a native Windows gate in addition to the Linux gate above.  This
  # exercises drive-qualified/UNC path handling and reparse-point rejection
  # on the platform where those hazards are real; no patient data or model
  # weights are required.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize SQLite schema
        run: npm run db:init

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Windows path and reparse-point tests
        run: npm exec vitest run tests/windows-path-redteam.test.ts tests/safety.test.ts --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Unit and integration tests
        run: npm test -- --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Legacy migration dry run
        run: npm run migrate:data -- --dry-run --source tests/fixtures/legacy-store.json --destination "$env:RUNNER_TEMP\visionscan-test.db"

      - name: Backup plan (read-only)
        run: npm run backup:data -- --dry-run

      - name: Phase 4 local intelligence safety acceptance
        run: npm exec vitest run tests/phase4-nextgen-local-intelligence.test.ts --pool=forks --maxWorkers=1 --minWorkers=1

      - name: Phase 5 false-negative reduction acceptance
        run: npm run validation:phase5

      - name: Phase 6 candidate and runtime acceptance
        run: npm run validation:phase6

      - name: Phase 7 retinal intelligence and runtime acceptance
        run: npm run validation:phase7

      - name: Audit local model manifests
        run: npm run model:audit

      - name: Generate de-identified SBOM
        run: node scripts/generate-sbom.mjs --output "$env:RUNNER_TEMP\visionscan-sbom.cdx.json"

      - name: Filesystem audit
        run: npm run audit:fs

      - name: Production build
        run: npm run build

  # A small authenticated browser smoke gate. It intentionally uses an empty
  # local SQLite database, a synthetic first-run account, and no model/data
  # assets; the full asset/responsive/a11y suite remains a local gate.
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:3000
      ALLOW_INSECURE_LOCAL_AUTH: "true"
      BROWSER_CI_USERNAME: browser-ci-admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure isolated storage roots
        shell: bash
        run: |
          # .env contains developer-local absolute paths. Set every storage
          # root explicitly so this job always uses an empty runner-local tree.
          echo "DATA_ROOT=$RUNNER_TEMP/visionscan-browser-data" >> "$GITHUB_ENV"
          echo "UPLOAD_ROOT=$RUNNER_TEMP/visionscan-browser-data/uploads" >> "$GITHUB_ENV"
          echo "DOCUMENTS_ROOT=$RUNNER_TEMP/visionscan-browser-data/documents" >> "$GITHUB_ENV"
          echo "PROCESSED_ROOT=$RUNNER_TEMP/visionscan-browser-data/processed" >> "$GITHUB_ENV"
          echo "REPORT_ROOT=$RUNNER_TEMP/visionscan-browser-data/reports" >> "$GITHUB_ENV"
          echo "DATABASE_ROOT=$RUNNER_TEMP/visionscan-browser-data/database" >> "$GITHUB_ENV"
          echo "DATABASE_FILE=$RUNNER_TEMP/visionscan-browser-data/database/eye-ai.db" >> "$GITHUB_ENV"
          echo "LEGACY_DATABASE_FILE=$RUNNER_TEMP/visionscan-browser-data/database/eye-ai.json" >> "$GITHUB_ENV"
          echo "MODEL_ROOT=$RUNNER_TEMP/visionscan-browser-data/models" >> "$GITHUB_ENV"
          echo "LOG_ROOT=$RUNNER_TEMP/visionscan-browser-data/logs" >> "$GITHUB_ENV"
          echo "TMP_ROOT=$RUNNER_TEMP/visionscan-browser-data/tmp" >> "$GITHUB_ENV"

      - name: Initialize isolated SQLite schema
        run: npm run db:init

      - name: Generate ephemeral synthetic account password
        shell: bash
        run: |
          browser_ci_password="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$browser_ci_password"
          echo "BROWSER_CI_PASSWORD=$browser_ci_password" >> "$GITHUB_ENV"

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Locate Chromium
        shell: bash
        run: |
          browser_path="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' -o -name chrome \) -print -quit)"
          test -n "$browser_path"
          echo "CHROME_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Start isolated local server
        shell: bash
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 > "$RUNNER_TEMP/visionscan-browser.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/visionscan-browser.pid"
          curl --fail --retry 30 --retry-delay 2 --retry-connrefused "$BASE_URL/login" > /dev/null

      - name: Hosted browser smoke
        run: npm run browser:ci

      - name: Stop server and show log
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/visionscan-browser.pid"; then
            kill "$(cat "$RUNNER_TEMP/visionscan-browser.pid")" || true
          fi
          if test -f "$RUNNER_TEMP/visionscan-browser.log"; then
            cat "$RUNNER_TEMP/visionscan-browser.log"
          fi
